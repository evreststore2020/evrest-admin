<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>لوحة التحكم | إفرست للدهانات</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f1f1f;--ink-2:#4d4d4d;--muted:#6b6b6b;--line:#e4e4e2;--bg:#f4f4f2;--card:#fff;--ok:#2e7d4f;--ok-bg:#e8f3ec;--warn:#9a6700;--warn-bg:#fff4d6;--red:#b3261e;--red-bg:#fbe9e7;--blue:#1d4f91;--blue-bg:#e8eff9}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.7}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;font-weight:600;background:var(--ink-2);color:#fff;transition:.2s;white-space:nowrap}
.btn:hover{background:var(--ink)}
.btn.light{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.light:hover{border-color:var(--ink)}
.btn.green{background:#25d366}.btn.green:hover{background:#1ebe5a}
.btn.red{background:#fff;color:var(--red);border:1px solid #f0c9c5}.btn.red:hover{background:var(--red-bg)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.in,select.in,textarea.in{width:100%;padding:10px 12px;border:1px solid var(--line);background:#fff;border-radius:0}
.in:focus{outline:none;border-color:var(--ink)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.f > span b{color:var(--ink)}
.hint{font-size:12px;color:var(--muted)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:800px){.g2,.g3,.g4{grid-template-columns:1fr}}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;font-size:12px;font-weight:600;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.red{background:var(--red-bg);color:var(--red)}.pill.blue{background:var(--blue-bg);color:var(--blue)}.pill.grey{background:#eee;color:#555}
.switch{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;user-select:none}
.switch input{position:absolute;opacity:0}
.switch i{width:38px;height:22px;background:#ccc;border-radius:99px;position:relative;transition:.2s;flex:none}
.switch i::after{content:"";position:absolute;top:3px;right:3px;width:16px;height:16px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked + i{background:var(--ok)}
.switch input:checked + i::after{right:19px}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,100px);background:var(--ink);color:#fff;padding:12px 22px;transition:.35s;z-index:200}
.toast.on{transform:translate(-50%,0)}

/* ===== شاشة الدخول ===== */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{background:#fff;width:min(520px,100%);padding:36px;display:flex;flex-direction:column;gap:16px}
.login-card h1{font-weight:300;font-size:28px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

/* ===== الهيكل ===== */
#app{display:none;min-height:100vh}
.side{position:fixed;top:0;bottom:0;right:0;width:250px;background:var(--ink);color:#d9d9d9;display:flex;flex-direction:column;z-index:30}
.side .brand{padding:22px 20px;border-bottom:1px solid rgba(255,255,255,.1)}
.side .brand b{display:block;color:#fff;font-size:18px;font-weight:600}
.side .brand small{font-size:12px;color:#9a9a9a}
.side nav{flex:1;overflow:auto;padding:10px 0}
.side nav button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 20px;text-align:right;font-size:15px;transition:.15s}
.side nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.side nav button.on{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset -3px 0 0 #fff}
.side nav button .ic{width:20px;text-align:center}
.side nav button .badge{margin-inline-start:auto;background:#fff;color:var(--ink);font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px}
.side nav button .badge.warn{background:#f6c344}
.side .foot{padding:14px 20px;border-top:1px solid rgba(255,255,255,.1);font-size:12px;color:#9a9a9a;display:flex;flex-direction:column;gap:6px}
.side .foot a,.side .foot button{color:#d9d9d9;text-align:right}
.main{margin-right:250px;min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 28px;flex-wrap:wrap}
.top h2{font-size:20px;font-weight:600;margin-inline-end:auto}
.pub-state{display:flex;align-items:center;gap:8px;font-size:13px}
.content{padding:28px;flex:1;max-width:1300px;width:100%}
.menu-toggle{display:none}
@media (max-width:900px){
  .side{transform:translateX(100%);transition:.3s;width:270px}
  .side.open{transform:none;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
  .main{margin-right:0}
  .menu-toggle{display:inline-flex}
  .top{padding:10px 16px}.content{padding:16px}
}

/* ===== عناصر ===== */
.card{background:var(--card);padding:22px;border:1px solid var(--line)}
.card h3{font-size:17px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.vorder{margin-top:10px;border:1px dashed var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.vorder.on{border-style:solid;border-color:#cfd9ee;background:#f6f8fd}
.vorder .vorder-prod{display:none}.vorder.on .vorder-prod{display:flex}
.vorder p.vorder-prod{margin:0}
.mcard .mdata{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.mcard .mdata span{background:var(--bg);padding:5px 10px;font-size:13px;display:flex;flex-direction:column}
.mcard .mdata small{color:var(--muted);font-size:11px}
.mdocs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;font-size:13px}
.mctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:12px;align-items:end}
.mctl label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
.mctl label.switch{flex-direction:row;align-items:center}
.mctl .switch.dis{opacity:.5}
.mnotes{grid-column:1/-1}
.sfields{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.sf-group{border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px}
.sf-group>b{color:var(--blue,#003087)}
.sf-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.sf-row select{max-width:120px}
.paycard{margin-top:10px;border:1px solid #cfd9ee;background:#f6f8fd;padding:12px 14px}
.paycard.done{border-color:#bfe3cc;background:#f2fbf5}
.pc-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.pc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.pc-grid label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
.pc-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.pc-rest{margin-inline-end:auto;font-size:14px}
.pay-sws{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.pay-sw{align-items:flex-start!important}
.pay-sw span{display:flex;flex-direction:column;gap:2px}
.pay-sw small{color:var(--muted);font-size:12px;font-weight:400}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:4px;text-align:right;transition:.2s}
button.kpi:hover{border-color:var(--ink)}
.kpi small{color:var(--muted);font-size:13px}
.kpi b{font-size:30px;font-weight:300;line-height:1.2}
.kpi .sub{font-size:12px;color:var(--muted)}
@media (max-width:900px){.kpis{grid-template-columns:1fr 1fr}}
.cols{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}
@media (max-width:1000px){.cols{grid-template-columns:1fr}}
.tasks{list-style:none;display:flex;flex-direction:column}
.tasks li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.tasks li:last-child{border:0}
.tasks .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;flex:none}
.tasks .dot.done{background:var(--ok-bg);color:var(--ok)}.tasks .dot.todo{background:var(--warn-bg);color:var(--warn)}
.tasks li span{flex:1}
.notice{padding:14px 16px;border:1px solid;margin-bottom:18px;display:flex;gap:12px;align-items:flex-start;font-size:14px}
.notice.warn{background:var(--warn-bg);border-color:#f2d58a;color:#5e4500}
.notice.blue{background:var(--blue-bg);border-color:#c5d6ef;color:#173c6d}
.notice.ok{background:var(--ok-bg);border-color:#bfe0cb;color:#1f5a38}
.notice .btn{margin-inline-start:auto}

/* الأحداث */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.chip{padding:6px 14px;border:1px solid var(--line);background:#fff;font-size:13px;transition:.15s}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink-2);color:#fff;border-color:var(--ink-2)}
.chip .n{opacity:.7;margin-inline-start:4px}
.ev{background:#fff;border:1px solid var(--line);padding:16px 18px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;margin-bottom:10px}
.ev .ty{width:42px;height:42px;display:grid;place-items:center;font-size:20px;background:var(--bg)}
.ev .who{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ev .who b{font-size:16px}
.ev pre{font-family:inherit;white-space:pre-wrap;font-size:14px;color:var(--ink-2);margin-top:6px;background:var(--bg);padding:10px 12px}
.ev .acts{display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:150px}
.ev.new{border-right:3px solid var(--blue)}
@media (max-width:700px){.ev{grid-template-columns:1fr}.ev .ty{display:none}.ev .acts{flex-direction:row;flex-wrap:wrap}}
.empty{padding:40px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #ccc}

/* المنتجات */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .in{max-width:320px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.pc{background:#fff;border:1px solid var(--line);display:flex;flex-direction:column}
.pc.missing{border-color:#f2d58a;box-shadow:inset 0 3px 0 #f6c344}
.pc.hidden-p{opacity:.65}
.pc .im{height:150px;background:#ecece9;display:grid;place-items:center;position:relative}
.pc .im img{height:85%;width:85%;object-fit:contain}
.pc .im .sw{width:70px;height:84px;border-radius:6px}
.pc .im .pill{position:absolute;top:10px;right:10px}
.pc .bd{padding:14px;display:flex;flex-direction:column;gap:10px;flex:1}
.pc .nm b{display:block;font-size:15px;line-height:1.4}
.pc .nm small{color:var(--muted);font-size:12px}
.price-in{display:flex;align-items:center;border:1px solid var(--line);background:#fff}
.price-in input{flex:1;min-width:0;border:0;padding:10px 12px;font-size:18px;font-weight:600}
.price-in input:focus{outline:none}
.price-in span{padding:0 12px;color:var(--muted);font-size:13px;white-space:nowrap}
.price-in:focus-within{border-color:var(--ink)}
.pc.missing .price-in{border-color:#e9b949;background:#fffbf0}
.packs{display:flex;flex-wrap:wrap;gap:6px}
.packs span{font-size:12px;background:var(--bg);padding:2px 8px}
.pc .row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.pc .ft{display:flex;gap:6px;border-top:1px solid var(--line);padding:10px 14px}

/* المحرّر الجانبي */
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:90;display:none}
.drawer-bg.on{display:block}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(640px,100%);background:#fff;z-index:100;transform:translateX(-100%);transition:transform .35s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .hd{display:flex;align-items:center;gap:10px;padding:16px 22px;border-bottom:1px solid var(--line)}
.drawer .hd b{font-size:18px;margin-inline-end:auto}
.drawer .bd{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:18px}
.drawer .ft{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px}
.sec-t{font-size:13px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:6px}
.prev{display:flex;gap:14px;align-items:center;background:var(--bg);padding:12px}
.prev .im{width:84px;height:84px;background:#e6e6e3;display:grid;place-items:center;flex:none}
.prev .im img{width:90%;height:90%;object-fit:contain}

/* إضافة */
.add-ways{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:1000px){.add-ways{grid-template-columns:1fr}}
.step{display:flex;gap:10px;align-items:flex-start}
.step em{font-style:normal;width:26px;height:26px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:13px;flex:none}
.guide ol{padding-right:20px;display:flex;flex-direction:column;gap:10px}
.guide code{background:var(--bg);padding:1px 6px;font-family:Consolas,monospace;font-size:13px;direction:ltr;display:inline-block}
.ed-item{background:#fff;border:1px solid var(--line);padding:18px;margin-bottom:14px}
.ed-item .hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ed-item .hd b{margin-inline-end:auto}
</style>
</head>
<body>

<div id="login"><div class="login-card" id="lockBox"><h1>لوحة تحكم إفرست</h1><p class="hint" id="bootMsg">جاري التحميل…</p></div></div>

<!-- ================= التطبيق ================= -->
<div id="app">
  <aside class="side" id="side">
    <div class="brand"><b>إفرست للدهانات</b><small id="modeLbl"></small></div>
    <nav id="nav">
      <button data-v="home"><span class="ic">⌂</span>الرئيسية</button>
      <button data-v="events"><span class="ic">🧾</span>الطلبات والنشاط<span class="badge" id="bdEvents" hidden></span></button>
      <button data-v="customers"><span class="ic">👤</span>العملاء المسجلين<span class="badge" id="bdCust" hidden></span></button>
      <button data-v="club"><span class="ic">🏅</span>نادي إفرست والشركاء<span class="badge" id="bdClub" hidden></span></button>
      <button data-v="products"><span class="ic">🎨</span>المنتجات والأسعار<span class="badge warn" id="bdMissing" hidden></span></button>
      <button data-v="add"><span class="ic">＋</span>إضافة منتج</button>
      <button data-v="videos"><span class="ic">▶</span>الفيديوهات</button>
      <button data-v="photos"><span class="ic">📸</span>صور أعمالنا</button>
      <button data-v="packages"><span class="ic">🏠</span>الباقات</button>
      <button data-v="reviews"><span class="ic">★</span>آراء العملاء</button>
      <button data-v="codes"><span class="ic">%</span>أكواد الخصم</button>
      <button data-v="settings"><span class="ic">⚙</span>الإعدادات</button>
      <button data-v="guide"><span class="ic">?</span>الاستضافة والمساعدة</button>
    </nav>
    <div class="foot">
      <a href="https://evreststore2020.github.io/everest-paints.github.io/everest-store/" target="_blank" rel="noopener">فتح المتجر ↗</a>
      <button id="logout">تسجيل الخروج</button>
    </div>
  </aside>
  <div class="main">
    <div class="top">
      <button class="btn light sm menu-toggle" id="menuT">☰</button>
      <h2 id="vTitle"></h2>
      <div class="pub-state" id="pubState"></div>
      <button class="btn light" id="previewBtn">معاينة</button>
      <button class="btn" id="publishBtn"></button>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>

<div class="drawer-bg" id="dBg"></div>
<aside class="drawer" id="drawer"><div class="hd"><b id="dTitle"></b><button class="btn light sm" id="dClose">✕</button></div><div class="bd" id="dBody"></div><div class="ft" id="dFoot"></div></aside>
<div class="toast" id="toast"></div>

<script src="assets/config.js"></script>
<script src="assets/supa.js"></script>
<script>
/* =====================================================================
   لوحة تحكم إفرست
   وضعين: (1) على الاستضافة مع api.php: حفظ فوري + سجل الطلبات + رفع الفيديوهات  (2) من غير سيرفر: تنزيل store.json
   ===================================================================== */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = n => (+n).toLocaleString("ar-EG");
const money = n => Math.round(n).toLocaleString("ar-EG") + " ج.م";
const IMG = (id, w = 240) => `https://cdn-pim.jotun.com/images/ProductImages/${id}/1300x1334/${id}.png?format=webp&width=${w}&quality=60`;
const imgOf = (p, w) => p.img ? IMG(p.img, w) : p.image ? (/^https?:/.test(p.image) ? p.image : "https://evreststore2020.github.io/everest-paints.github.io/everest-store/" + p.image) : "";
const ls = {get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch (e) { return d } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) {} }, del(k) { try { localStorage.removeItem(k) } catch (e) {} }};
let tt; const toast = t => { $("#toast").textContent = t; $("#toast").classList.add("on"); clearTimeout(tt); tt = setTimeout(() => $("#toast").classList.remove("on"), 2600) };

const CATS = {interior: "داخلية", deco: "تأثيرات ديكورية", exterior: "خارجية", prep: "تأسيس ومعاجين", wood: "دهانات أخشاب", industrial: "صناعية"};
const VARIANTS = ["", "أبيض", "ألوان خاصة", "ألوان جاهزة"];
/* القوائم اللي تقدر تكتب فيها اختيار جديد ويتحفظ (في الإعدادات settings.opts) */
const OPT_DEF = {units: ["لتر", "كجم", "قطعة", "كرتونة", "شيكارة", "برميل", "جالون", "علبة", "طقم", "متر"], variants: VARIANTS, cats: Object.keys(CATS)};
const OPT_LBL = {units: "وحدة جديدة", variants: "نوع جديد", cats: "قسم جديد"};
const catName = k => CATS[k] || k || "";
function optList(kind) {
  const used = kind === "units" ? D.products.flatMap(p => [p.u, ...(p.packs || []).map(k => k.u)]) : kind === "cats" ? D.products.map(p => p.cat) : D.products.flatMap(p => (p.packs || []).map(k => k.v || ""));
  return [...new Set([...OPT_DEF[kind], ...(((D.settings.opts || {})[kind]) || []), ...used].filter(x => x != null && (x !== "" || kind === "variants")))];
}
function optSelect(kind, cur, attrs) {
  const L = optList(kind); if (cur != null && !L.includes(cur)) L.push(cur);
  const lbl = v => kind === "cats" ? catName(v) : kind === "variants" ? v || "—" : v;
  return `<select class="in" data-newopt="${kind}" ${attrs}>${L.map(v => `<option value="${esc(v)}" ${v === cur ? "selected" : ""}>${esc(lbl(v))}</option>`).join("")}<option value="__new">✏️ اكتب ${OPT_LBL[kind]}…</option></select>`;
}
/* لما يختار «اكتب جديد»: بيكتبه، بيتضاف للقايمة ويتحفظ، وبيتختار على طول */
document.addEventListener("focusin", e => { const s = e.target.closest && e.target.closest("select[data-newopt]"); if (s && s.value !== "__new") s.dataset.prev = s.value }, true);
document.addEventListener("input", e => {
  const s = e.target.closest && e.target.closest("select[data-newopt]"); if (!s || s.value !== "__new") { if (s) s.dataset.prev = s.value; return }
  e.stopImmediatePropagation();

/* رفع فيديو للسيرفر على أجزاء (عشان يعدّي من حدود حجم الرفع في الاستضافة) */
async function uploadToServer(file, onProgress) {

    if (file.size > 50 * 1048576) throw new Error("الفيديو أكبر من 50 ميجا (حد Supabase المجاني) – ارفعه على يوتيوب وضيف الرابط");
    const ext = ((file.name.match(/\.(mp4|webm|mov)$/i) || [".mp4"])[0]).toLowerCase();
    const base = (file.name.replace(/\.[^.]+$/, "").toLowerCase().replace(/[^a-z0-9-]+/g, "-").replace(/^-+|-+$/g, "") || "video").slice(0, 40);
    const path = base + "-" + Date.now().toString(36) + ext;
    await SBC.ensureFresh();
    try { await SBC.upload("videos", path, file, onProgress) } catch (e) { throw new Error(e.status === 413 ? "الفيديو كبير" : e.status === 403 || e.status === 401 ? "انتهت الجلسة، ادخل تاني" : "تعذّر الرفع: " + e.message) }
    return SBC.publicUrl("videos", path);
  }
  const chunk = (SERVER.chunkMB || 4) * 1048576, total = Math.max(1, Math.ceil(file.size / chunk));
  if (file.size > (SERVER.maxVideoMB || 300) * 1048576) throw new Error(`الفيديو أكبر من ${SERVER.maxVideoMB || 300} ميجا`);
  const uploadId = Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(16).padStart(2, "0")).join("");
  for (let i = 0; i < total; i++) {
    const fd = new FormData();
    fd.append("action", "uploadChunk"); fd.append("token", KEY); fd.append("uploadId", uploadId);
    fd.append("index", i); fd.append("total", total); fd.append("name", file.name.replace(/\.[^.]+$/, ""));
    fd.append("chunk", file.slice(i * chunk, (i + 1) * chunk), "chunk");
    let r; for (let tries = 0; tries < 3; tries++) { try { r = await post(null, fd); break } catch (e) { if (tries === 2) throw new Error("انقطع الاتصال أثناء الرفع") } }
    if (!r.ok) throw new Error({size: "الفيديو كبير", type: "الملف ده مش فيديو MP4 أو MOV أو WEBM", upload: "الاستضافة رفضت جزء من الملف"}[r.error] || "تعذّر الرفع");
    onProgress && onProgress(Math.round((i + 1) / total * 100));
    if (i === total - 1) return r.src;
  }
}

const dataBlob = url => { const [h, b] = url.split(","), bin = atob(b), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], {type: h.slice(5, h.indexOf(";"))}) };

function bindPay() {

      const pay = Object.assign({}, e.pay, {status: card.querySelector("[data-pay-st]").value, final: f === "" ? null : +f, paid: p === "" ? 0 : +p});
      /* الحالة بتتظبط لوحدها من المبالغ */
      if (pay.final != null && pay.paid >= pay.final && pay.paid > 0) pay.status = "مدفوع بالكامل";
      else if (pay.paid > 0 && pay.status === "لم يدفع") pay.status = "دفع جزء";
      return pay;
    };
    /* المتبقي وزرار طلب الدفع بيتحدّثوا وإنت بتكتب */
    const live = () => { const y = read(), rest = y.final == null ? null : Math.max(0, y.final - (y.paid || 0)), r = card.querySelector(".pc-rest"), b = card.querySelector("[data-pay-req]");
      r.innerHTML = rest == null ? "اكتب الإجمالي النهائي عشان تبعت طلب الدفع" : rest > 0 ? `المتبقي: <b>${money(rest)}</b>` : `<b style="color:var(--ok)">✓ مفيش متبقي</b>`; if (b) b.disabled = !(rest > 0) };

      const old = e.pay; e.pay = pay;
      try { const r = await api("pay", {id: e.id, pay}); if (!r.ok) throw 0; toast(msg || "تم الحفظ ✓"); refreshBadges(); go(view) }
      catch (err) { e.pay = old; toast("تعذّر الحفظ – اتأكد إنك شغّلت تحديث قاعدة البيانات (supabase-payments.sql)") }
    };

        P.vf !== false && (P.vfUrl || P.vfNumber) ? [`📱 محفظة إلكترونية (أي محفظة)${P.vfNumber ? ": " + P.vfNumber : ""}`, P.vfNumber ? "" : P.vfUrl].filter(Boolean).join("\n") : ""

/* يتعرف على رابط الفيديو ويطلع النوع والمعرّف */
function parseVideo(url) {
  url = String(url || "").trim(); let m;
  if ((m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/))) return {type: "youtube", src: m[1], vertical: /\/shorts\//.test(url)};
  if ((m = url.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:.*&)?id=)([\w-]{20,})/))) return {type: "drive", src: m[1]};
  if ((m = url.match(/tiktok\.com\/.*\/video\/(\d+)/))) return {type: "tiktok", src: m[1], vertical: true};
  if ((m = url.match(/instagram\.com\/(?:reel|reels|p)\/([\w-]+)/))) return {type: "instagram", src: m[1], vertical: /\/reels?\//.test(url)};
  if (/^https:\/\/(www\.|m\.|web\.)?(facebook\.com|fb\.watch)\//.test(url)) return {type: "facebook", src: url, vertical: /\/reel\//.test(url)};
  if (/^(https:\/\/|assets\/)[^\s"']+\.(mp4|webm|mov)(\?[^\s"']*)?$/i.test(url)) return {type: "file", src: url};
  return null;
}
